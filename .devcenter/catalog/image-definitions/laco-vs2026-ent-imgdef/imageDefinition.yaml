$schema: "1.0"
name: "laco-vs2026-ent-imgdef"
description: "VS 2026 Enterprise PPE validation image with a harmless marker."
image: microsoftvisualstudio_visualstudiolatestplustools_vs-latest-ent-win11-m365-gen2

tasks:
  - name: ~/powershell
    description: Create the PREP-ENT-ID validation marker
    parameters:
      command: |
        New-Item -ItemType Directory -Path 'C:\ProgramData\laco-vs2026' -Force | Out-Null
        Set-Content -Path 'C:\ProgramData\laco-vs2026\PREP-ENT-ID.txt' -Value 'PREP-ENT-ID 2026-08-19T13:40:00.7534757-07:00' -Encoding ascii
