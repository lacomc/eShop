$schema: "1.0"
name: "user-task-parent"
image: microsoftvisualstudio_visualstudioplustools_vs-2022-ent-general-win11-m365-gen2
description: "This definition will be used to develop the cached image definition script story"

parameters:
  script1:
    type: string
    default: 'C:\ProgramData\Microsoft\DevBoxAgent\ImageDefinitions\eshop-laco-user-task-inheritance\user-task-parent\write-to-file.ps1'
    description: "The message to write to the file from the cached script"
  script2:
    type: string
    default: 'C:\ProgramData\Microsoft\DevBoxAgent\ImageDefinitions\eshop-laco-user-task-inheritance\user-task-parent\write-to-file-user.ps1'
    description: "The message to write to the file from the cached script"

tasks:
  - name: powershell
    displayName: "Cached Script"
    parameters:
      script: '{{script1}}'
userTasks:
  - name: powershell
    displayName: "User Cached Script"
    parameters:
      script: '{{script2}'